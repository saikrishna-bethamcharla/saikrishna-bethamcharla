name: Update recently pushed repos

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/build_latest.py
      - .github/workflows/update-latest.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build latest.svg and the link row
        run: python scripts/build_latest.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # EXCLUDE: "repo-one,repo-two"
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/latest.svg README.md
          git diff --cached --quiet || git commit -m "chore: refresh recently pushed repos"
          git push
