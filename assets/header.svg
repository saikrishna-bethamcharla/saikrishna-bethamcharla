<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Sai Krishna Bethamcharla, Creative and Technical Lead at ZAI Labs" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glow" cx="82%" cy="20%" r="70%">
      <stop offset="0" stop-color="#3B5BDB" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3B5BDB" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1A2140" stroke-width="1"/>
    </pattern>
    <pattern id="ticks" width="20" height="8" patternUnits="userSpaceOnUse">
      <path d="M0.5 0V6" stroke="#2F3A6B" stroke-width="1"/>
    </pattern>
    <pattern id="major" width="100" height="16" patternUnits="userSpaceOnUse">
      <path d="M0.5 0V14" stroke="#4A5A9E" stroke-width="1"/>
    </pattern>
    <style>
      .sans { font-family: 'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif; }
      .mono { font-family: 'JetBrains Mono','SF Mono','Fira Code',Consolas,monospace; }
      .rec { animation: pulse 1.6s ease-in-out infinite; }
      .head { animation: scrub 16s linear infinite; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }
      @keyframes scrub { from { transform: translateX(0); } to { transform: translateX(1072px); } }
      @media (prefers-reduced-motion: reduce) {
        .rec, .head { animation: none; }
        .head { transform: translateX(420px); }
      }
    </style>
  </defs>

  <rect width="1200" height="320" fill="#060812"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <!-- viewfinder corners -->
  <g stroke="#7AB8FF" stroke-width="2" fill="none" stroke-linecap="square">
    <path d="M24 52V24H52"/>
    <path d="M1148 24H1176V52"/>
    <path d="M24 268V296H52"/>
    <path d="M1148 296H1176V268"/>
  </g>

  <!-- rec indicator and timecode -->
  <circle class="rec" cx="68" cy="62" r="5" fill="#FF4D5E"/>
  <text class="mono" x="84" y="67" font-size="14" fill="#8E9BC4">rec</text>
  <text class="mono" x="1132" y="67" font-size="14" fill="#8E9BC4" text-anchor="end">01:00:00:00</text>

  <!-- identity -->
  <text class="mono" x="64" y="132" font-size="16" fill="#7AB8FF">Creative &amp; Technical Lead, ZAI Labs</text>
  <text class="sans" x="62" y="198" font-size="58" font-weight="600" fill="#E8F1FF" letter-spacing="-1">Sai Krishna Bethamcharla</text>
  <text class="sans" x="64" y="240" font-size="22" fill="#8E9BC4">Generative AI video, and the infrastructure that runs it.</text>

  <!-- timeline -->
  <line x1="64" y1="272" x2="1136" y2="272" stroke="#2F3A6B" stroke-width="1"/>
  <rect x="64" y="266" width="1072" height="8" fill="url(#ticks)"/>
  <rect x="64" y="266" width="1072" height="16" fill="url(#major)"/>
  <g transform="translate(64 0)">
    <g class="head">
      <path d="M-5 258H5L0 266Z" fill="#7AB8FF"/>
      <line x1="0" y1="266" x2="0" y2="290" stroke="#7AB8FF" stroke-width="1.5"/>
    </g>
  </g>
</svg>
