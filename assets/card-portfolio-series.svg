<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 190" width="590" height="190" role="img" aria-label="Portfolio styled like a streaming series" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1A2140" stroke-width="1"/></pattern><style>.sans{font-family:'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif}
.mono{font-family:'JetBrains Mono','SF Mono','Fira Code',Consolas,monospace}
.foc{opacity:0;animation:foc 4.8s infinite}
.prog{transform-box:fill-box;transform-origin:0 50%;animation:prog 4.8s linear infinite}
@keyframes foc{0%,24%{opacity:1}25%,100%{opacity:0}}
@keyframes prog{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style></defs>
<rect x=".5" y=".5" width="589" height="189" rx="12" fill="#0B1020" stroke="#2A3358"/>
<rect x=".5" y=".5" width="589" height="189" rx="12" fill="url(#grid)" opacity=".6"/>
<text class="mono" x="28" y="40" font-size="12" fill="#7AB8FF">portfolio</text>
<text class="sans" x="28" y="80" font-size="26" font-weight="600" fill="#E8F1FF">Sai Krishna: The Series</text>
<text class="sans" x="28" y="108" font-size="14" fill="#8E9BC4">A streaming-style portfolio where every</text>
<text class="sans" x="28" y="128" font-size="14" fill="#8E9BC4">section is an episode, every project an Original.</text>
<text class="mono" x="28" y="162" font-size="12" fill="#6F7BA8">TypeScript / Node.js</text>
<rect x="418" y="40" width="30" height="58" rx="4" fill="#16204A"/><rect class="foc" style="animation-delay:0.0s" x="415" y="37" width="36" height="64" rx="6" fill="none" stroke="#7AB8FF" stroke-width="2"/><rect x="456" y="40" width="30" height="58" rx="4" fill="#1E2B66"/><rect class="foc" style="animation-delay:1.2s" x="453" y="37" width="36" height="64" rx="6" fill="none" stroke="#7AB8FF" stroke-width="2"/><rect x="494" y="40" width="30" height="58" rx="4" fill="#2B3F8F"/><rect class="foc" style="animation-delay:2.4s" x="491" y="37" width="36" height="64" rx="6" fill="none" stroke="#7AB8FF" stroke-width="2"/><rect x="532" y="40" width="30" height="58" rx="4" fill="#3A55B8"/><rect class="foc" style="animation-delay:3.6s" x="529" y="37" width="36" height="64" rx="6" fill="none" stroke="#7AB8FF" stroke-width="2"/><rect x="418" y="122" width="144" height="4" rx="2" fill="#1F2850"/><rect class="prog" x="418" y="122" width="144" height="4" rx="2" fill="#7AB8FF"/><text class="mono" x="418" y="150" font-size="11" fill="#8E9BC4">now streaming</text>
</svg>
