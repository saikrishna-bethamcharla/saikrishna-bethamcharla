<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 190" width="590" height="190" role="img" aria-label="Vasudha Pharma Chem corporate web platform" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1A2140" stroke-width="1"/></pattern><style>.sans{font-family:'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif}
.mono{font-family:'JetBrains Mono','SF Mono','Fira Code',Consolas,monospace}
.ring{stroke-dasharray:204;animation:draw 5s ease-in-out infinite}
.atom{animation:atom 5s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:204}55%,100%{stroke-dashoffset:0}}
@keyframes atom{0%,45%{opacity:0}65%,100%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style></defs>
<rect x=".5" y=".5" width="589" height="189" rx="12" fill="#0B1020" stroke="#2A3358"/>
<rect x=".5" y=".5" width="589" height="189" rx="12" fill="url(#grid)" opacity=".6"/>
<text class="mono" x="28" y="40" font-size="12" fill="#7AB8FF">client work</text>
<text class="sans" x="28" y="80" font-size="26" font-weight="600" fill="#E8F1FF">Vasudha Pharma Chem</text>
<text class="sans" x="28" y="108" font-size="14" fill="#8E9BC4">Corporate site for a pharma manufacturer, with</text>
<text class="sans" x="28" y="128" font-size="14" fill="#8E9BC4">a product catalog, RFQ cart and staff portal.</text>
<text class="mono" x="28" y="162" font-size="12" fill="#6F7BA8">Live on GitHub Pages</text>
