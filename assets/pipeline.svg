<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" width="1200" height="270" role="img" aria-label="How my tools connect: from prompt through ComfyUI, Higgsfield and Resolve to final cut, shipped as browser tools and live sites" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1A2140" stroke-width="1"/></pattern><style>.sans{font-family:'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif}
