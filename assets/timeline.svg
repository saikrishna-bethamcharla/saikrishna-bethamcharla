FF">DaVinci Resolve</text><rect class="clip" style="animation-delay:6.78s" x="610" y="116" width="200" height="32" rx="6" fill="#9B7BFF" stroke="#9B7BFF"/><text class="mono" x="622" y="137" font-size="12" fill="#E8F1FF">After Effects</text><rect class="clip" style="animation-delay:9.87s" x="820" y="116" width="130" height="32" rx="6" fill="#9B7BFF" stroke="#9B7BFF"/><text class="mono" x="832" y="137" font-size="12" fill="#E8F1FF">Blender</text><rect class="clip" style="animation-delay:11.94s" x="960" y="116" width="120" height="32" rx="6" fill="#9B7BFF" stroke="#9B7BFF"/><text class="mono" x="972" y="137" font-size="12" fill="#E8F1FF">Audition</text><rect x="24" y="164" width="1152" height="40" rx="6" fill="#0B1020" stroke="#1A2140"/><text class="mono" x="40" y="189" font-size="12" fill="#8E9BC4">Code</text><rect class="clip" style="animation-delay:0.00s" x="150" y="168" width="170" height="32" rx="6" fill="#2FC4E0" stroke="#2FC4E0"/><text class="mono" x="162" y="189" font-size="12" fill="#E8F1FF">TypeScript</text><rect class="clip" style="animation-delay:2.65s" x="330" y="168" width="140" height="32" rx="6" fill="#2FC4E0" stroke="#2FC4E0"/><text class="mono" x="342" y="189" font-size="12" fill="#E8F1FF">Next.js</text><rect class="clip" style="animation-delay:4.86s" x="480" y="168" width="140" height="32" rx="6" fill="#2FC4E0" stroke="#2FC4E0"/><text class="mono" x="492" y="189" font-size="12" fill="#E8F1FF">Tailwind</text><rect class="clip" style="animation-delay:7.07s" x="630" y="168" width="180" height="32" rx="6" fill="#2FC4E0" stroke="#2FC4E0"/><text class="mono" x="642" y="189" font-size="12" fill="#E8F1FF">Canvas / WebGL</text><rect class="clip" style="animation-delay:9.87s" x="820" y="168" width="130" height="32" rx="6" fill="#2FC4E0" stroke="#2FC4E0"/><text class="mono" x="832" y="189" font-size="12" fill="#E8F1FF">Python</text><rect class="clip" style="animation-delay:11.94s" x="960" y="168" width="120" height="32" rx="6" fill="#2FC4E0" stroke="#2FC4E0"/><text class="mono" x="972" y="189" font-size="12" fill="#E8F1FF">Node.js</text><rect x="24" y="216" width="1152" height="40" rx="6" fill="#0B1020" stroke="#1A2140"/><text class="mono" x="40" y="241" font-size="12" fill="#8E9BC4">Cloud</text><rect class="clip" style="animation-delay:0.00s" x="150" y="220" width="120" height="32" rx="6" fill="#3DD6B0" stroke="#3DD6B0"/><text class="mono" x="162" y="241" font-size="12" fill="#E8F1FF">Docker</text><rect class="clip" style="animation-delay:1.92s" x="280" y="220" width="110" height="32" rx="6" fill="#3DD6B0" stroke="#3DD6B0"/><text class="mono" x="292" y="241" font-size="12" fill="#E8F1FF">AWS</text><rect class="clip" style="animation-delay:3.68s" x="400" y="220" width="160" height="32" rx="6" fill="#3DD6B0" stroke="#3DD6B0"/><text class="mono" x="412" y="241" font-size="12" fill="#E8F1FF">Kubernetes</text><rect class="clip" style="animation-delay:6.19s" x="570" y="220" width="150" height="32" rx="6" fill="#3DD6B0" stroke="#3DD6B0"/><text class="mono" x="582" y="241" font-size="12" fill="#E8F1FF">Terraform</text><g transform="translate(150 0)"><g class="head"><path d="M-5 20H5L0 29Z" fill="#7AB8FF"/><line x1="0" y1="29" x2="0" y2="274" stroke="#7AB8FF" stroke-width="1.5"/></g></g>
