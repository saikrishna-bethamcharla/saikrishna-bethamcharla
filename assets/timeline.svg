<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="1200" height="290" role="img" aria-label="My toolbox laid out as an editing timeline with tracks for AI video, post-production, code and cloud" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1A2140" stroke-width="1"/></pattern><pattern id="ticks" width="20" height="8" patternUnits="userSpaceOnUse"><path d="M0.5 0V6" stroke="#2F3A6B" stroke-width="1"/></pattern>
<pattern id="major" width="100" height="16" patternUnits="userSpaceOnUse"><path d="M0.5 0V14" stroke="#4A5A9E" stroke-width="1"/></pattern><style>.sans{font-family:'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif}
.mono{font-family:'JetBrains Mono','SF Mono','Fira Code',Consolas,monospace}
.clip{fill-opacity:.3;animation:flash 14.0s linear infinite}
.head{animation:scrub 14.0s linear infinite}
@keyframes flash{0%{fill-opacity:.85}7%{fill-opacity:.3}100%{fill-opacity:.3}}
@keyframes scrub{from{transform:translateX(0)}to{transform:translateX(950px)}}
@media (prefers-reduced-motion: reduce){.head{transform:translateX(300px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style></defs>
