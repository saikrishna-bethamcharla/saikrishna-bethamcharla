<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 190" width="590" height="190" role="img" aria-label="Epic Hertz Studio, a kinetic subtitle generator" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1A2140" stroke-width="1"/></pattern><style>.sans{font-family:'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif}
.mono{font-family:'JetBrains Mono','SF Mono','Fira Code',Consolas,monospace}
.hl{opacity:0;animation:hl 3.6s infinite}
.wt{animation:wt 3.6s infinite}
@keyframes hl{0%,33%{opacity:1}34%,100%{opacity:0}}
@keyframes wt{0%,33%{fill:#060812}34%,100%{fill:#8E9BC4}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style></defs>
<rect x=".5" y=".5" width="589" height="189" rx="12" fill="#0B1020" stroke="#2A3358"/>
<rect x=".5" y=".5" width="589" height="189" rx="12" fill="url(#grid)" opacity=".6"/>
<text class="mono" x="28" y="40" font-size="12" fill="#7AB8FF">creative tooling</text>
<text class="sans" x="28" y="80" font-size="26" font-weight="600" fill="#E8F1FF">Epic Hertz Studio</text>
<text class="sans" x="28" y="108" font-size="14" fill="#8E9BC4">AI auto-captioning and kinetic subtitles for</text>
<text class="sans" x="28" y="128" font-size="14" fill="#8E9BC4">Reels, Shorts and TikTok.</text>
<text class="mono" x="28" y="162" font-size="12" fill="#6F7BA8">Next.js / TypeScript / Tailwind / Framer Motion</text>
<rect x="452" y="20" width="90" height="150" rx="12" fill="#060812" stroke="#3A4577"/>
<rect x="462" y="30" width="70" height="44" rx="6" fill="#16204A"/>
<path d="M462 62Q480 40 497 56T532 46V74H462Z" fill="#2B3F8F"/><rect class="hl" style="animation-delay:0.0s" x="464" y="87" width="66" height="23" rx="5" fill="#7AB8FF"/><text class="mono wt" style="animation-delay:0.0s" x="497" y="104" font-size="16" font-weight="700" fill="#8E9BC4" text-anchor="middle">words</text><rect class="hl" style="animation-delay:1.2s" x="464" y="113" width="66" height="23" rx="5" fill="#7AB8FF"/><text class="mono wt" style="animation-delay:1.2s" x="497" y="130" font-size="16" font-weight="700" fill="#8E9BC4" text-anchor="middle">that</text><rect class="hl" style="animation-delay:2.4s" x="464" y="139" width="66" height="23" rx="5" fill="#7AB8FF"/><text class="mono wt" style="animation-delay:2.4s" x="497" y="156" font-size="16" font-weight="700" fill="#8E9BC4" text-anchor="middle">move</text>
</svg>
