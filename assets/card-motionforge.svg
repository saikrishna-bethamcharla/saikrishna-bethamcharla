<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 190" width="590" height="190" role="img" aria-label="MotionForge, a browser motion graphics studio with alpha video export" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1A2140" stroke-width="1"/></pattern><style>.sans{font-family:'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif}
.mono{font-family:'JetBrains Mono','SF Mono','Fira Code',Consolas,monospace}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 3.2s ease-in-out infinite alternate}
@keyframes grow{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style></defs>
<rect x=".5" y=".5" width="589" height="189" rx="12" fill="#0B1020" stroke="#2A3358"/>
<rect x=".5" y=".5" width="589" height="189" rx="12" fill="url(#grid)" opacity=".6"/>
<text class="mono" x="28" y="40" font-size="12" fill="#7AB8FF">creative tooling</text>
<text class="sans" x="28" y="80" font-size="26" font-weight="600" fill="#E8F1FF">MotionForge</text>
<text class="sans" x="28" y="108" font-size="14" fill="#8E9BC4">Motion graphics in the browser, with WebM</text>
<text class="sans" x="28" y="128" font-size="14" fill="#8E9BC4">alpha export for Resolve and Premiere.</text>
<text class="mono" x="28" y="162" font-size="12" fill="#6F7BA8">TypeScript / Canvas / WebGL</text>
<defs><pattern id="chk" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#0F1530"/><rect width="10" height="10" fill="#161D40"/><rect x="10" y="10" width="10" height="10" fill="#161D40"/></pattern></defs>
<rect x="430" y="24" width="130" height="138" rx="8" fill="url(#chk)" stroke="#2F3A6B" stroke-dasharray="4 4"/>
<line x1="444" y1="150" x2="546" y2="150" stroke="#2F3A6B"/><rect class="bar" style="animation-delay:-0.4s" x="448" y="100" width="16" height="50" rx="3" fill="#7AB8FF" fill-opacity=".9"/><rect class="bar" style="animation-delay:-1.0s" x="474" y="62" width="16" height="88" rx="3" fill="#7AB8FF" fill-opacity=".9"/><rect class="bar" style="animation-delay:-1.7s" x="500" y="82" width="16" height="68" rx="3" fill="#7AB8FF" fill-opacity=".9"/><rect class="bar" style="animation-delay:-2.3s" x="526" y="42" width="16" height="108" rx="3" fill="#7AB8FF" fill-opacity=".9"/>
</svg>
